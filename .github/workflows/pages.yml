name: Publish

# Every push to main that passes its checks is published to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Only the app itself: no tests, no scripts, and not the maintainer's own calibration.
      - run: |
          mkdir site
          cp -r index.html manifest.webmanifest icon.svg LICENSE src styles site/
      # Stamp the footer with when this version was published, and its commit.
      - run: |
          stamp="Updated $(date -u '+%-d %b %Y') · <a href=\"https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}\" target=\"_blank\" rel=\"noopener\">${GITHUB_SHA::7}</a>"
          sed -i "s|<span id=\"app-build\" hidden></span>|<span id=\"app-build\">${stamp}</span>|" site/index.html
          grep -q '<span id="app-build">Updated' site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
